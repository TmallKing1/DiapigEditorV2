[package]
name = "diapig-editor"
version = "2.0.1"
description = "千星奇域对话编辑器"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
fontdb = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
primfit = { path = "primfit" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
tauri-plugin-clipboard-manager = "2"
# 评论抓取：代发评论接口请求（网页端会被跨域拦下）
reqwest = { version = "0.13", features = ["json"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[workspace]
members = ["primfit"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 图元拟合是纯计算，单独按速度优化；其余部分仍按体积优化
[profile.release.package.primfit]
opt-level = 3

[profile.dev.package.primfit]
opt-level = 3
